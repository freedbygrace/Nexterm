name: Deploy Development Images

on:
  push:
    branches: [ "main" ]

# Pushes ghcr.io/<owner>/nexterm/{server,engine,aio}:development for every commit on main.
permissions:
  contents: read
  packages: write

jobs:
  components:
    name: "Dev Docker (${{ matrix.slug }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: server
            dockerfile: Dockerfile.server
          - slug: engine
            dockerfile: Dockerfile.engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image namespace
        id: img
        shell: bash
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nexterm" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.img.outputs.base }}/${{ matrix.slug }}:development
          cache-from: type=gha,scope=dev-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.slug }}

  aio:
    name: "Dev Docker (aio)"
    runs-on: ubuntu-latest
    needs: components

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image namespace
        id: img
        shell: bash
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nexterm" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.img.outputs.base }}/aio:development
          build-args: |
            SERVER_IMAGE=${{ steps.img.outputs.base }}/server:development
            ENGINE_IMAGE=${{ steps.img.outputs.base }}/engine:development
          cache-from: type=gha,scope=dev-aio
          cache-to: type=gha,mode=max,scope=dev-aio