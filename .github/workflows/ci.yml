name: CI

on:
  push:
    branches: ["main", "development"]
  pull_request:
    branches: ["main", "development"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: "Server"
    # sqlite3 prebuilt binaries need glibc 2.38+
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install flatc
        run: |
          curl -sSL -o /tmp/flatc.zip https://github.com/google/flatbuffers/releases/download/v24.12.23/Linux.flatc.binary.g++-13.zip
          sudo unzip -o /tmp/flatc.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/flatc
          flatc --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate FlatBuffers bindings
        run: yarn schema:generate

      - name: Syntax-check server sources
        run: |
          set -e
          for f in $(git ls-files 'server/**/*.js' 'server/*.js'); do node --check "$f"; done

      - name: Boot server and run migrations
        env:
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SERVER_PORT: "6999"
        run: |
          mkdir -p /tmp/nexterm-ci && cd /tmp/nexterm-ci
          node "$GITHUB_WORKSPACE/server/index.js" > boot.log 2>&1 &
          PID=$!
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:6999/api/service || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "server answered HTTP $code after ${i} polls"
              grep -q "Server listening on port" boot.log || { echo "server did not log readiness"; cat boot.log; kill $PID; exit 1; }
              kill $PID; exit 0
            fi
            if ! kill -0 $PID 2>/dev/null; then echo "server exited early"; cat boot.log; exit 1; fi
            sleep 2
          done
          echo "server did not start"; cat boot.log; kill $PID; exit 1

  client:
    name: "Client"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: client
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: client
        run: yarn build

  cli:
    name: "CLI"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build
        working-directory: cli
        # finalize-release bumps cli/Cargo.toml without touching Cargo.lock, so do not pass --locked
        run: cargo build

  mobile:
    name: "Mobile (analyze)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: "stable"

      - name: Analyze
        working-directory: mobile
        run: |
          flutter pub get
          # the codebase carries a few style lints; only real errors fail the build
          flutter analyze --no-fatal-infos --no-fatal-warnings

  engine-image:
    name: "Engine image (build only)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Compiles the C engine against the vendored guacamole-server exactly like a release would,
      # without pushing anything.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.engine
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=dev-engine
          cache-to: type=gha,mode=max,scope=dev-engine
