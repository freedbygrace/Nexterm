name: Build Docker

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

# Images are published to GitHub Container Registry under the repository owner, so the
# pipeline works on any fork without extra secrets:
#   ghcr.io/<owner>/nexterm/server, ghcr.io/<owner>/nexterm/engine, ghcr.io/<owner>/nexterm/aio
permissions:
  contents: read
  packages: write

jobs:
  build-components:
    name: "Docker ${{ matrix.slug }} (${{ matrix.platform_arch }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        slug: [server, engine]
        platform_arch: [amd64, arm64]
        include:
          - platform_arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - platform_arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - slug: server
            dockerfile: Dockerfile.server
          - slug: engine
            dockerfile: Dockerfile.engine

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image namespace
        id: img
        shell: bash
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nexterm" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.base }}/${{ matrix.slug }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
          outputs: type=image,name=${{ steps.img.outputs.base }}/${{ matrix.slug }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.slug }}-${{ matrix.platform_arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}-${{ matrix.platform_arch }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/${{ matrix.slug }}
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${{ matrix.slug }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.slug }}-${{ matrix.platform_arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 1

  merge-components:
    name: "Merge Manifests (${{ matrix.slug }})"
    runs-on: ubuntu-latest
    needs: build-components
    strategy:
      matrix:
        slug: [server, engine]

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests/${{ matrix.slug }}
          pattern: digests-${{ matrix.slug }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image namespace
        id: img
        shell: bash
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nexterm" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        run: |
          IMAGE="${{ steps.img.outputs.base }}/${{ matrix.slug }}"
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ inputs.version }}" \
            $(printf "$IMAGE@sha256:%s " $(ls "${{ runner.temp }}/digests/${{ matrix.slug }}"))

  build-aio:
    name: "Docker aio (${{ matrix.platform_arch }})"
    runs-on: ${{ matrix.runner }}
    needs: merge-components
    strategy:
      fail-fast: false
      matrix:
        platform_arch: [amd64, arm64]
        include:
          - platform_arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - platform_arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image namespace
        id: img
        shell: bash
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nexterm" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.base }}/aio

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVER_IMAGE=${{ steps.img.outputs.base }}/server:${{ inputs.version }}
            ENGINE_IMAGE=${{ steps.img.outputs.base }}/engine:${{ inputs.version }}
          outputs: type=image,name=${{ steps.img.outputs.base }}/aio,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=aio-${{ matrix.platform_arch }}
          cache-to: type=gha,mode=max,scope=aio-${{ matrix.platform_arch }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/aio
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/aio/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-aio-${{ matrix.platform_arch }}
          path: ${{ runner.temp }}/digests/aio/
          if-no-files-found: error
          retention-days: 1

  merge-aio:
    name: "Merge Manifests (aio)"
    runs-on: ubuntu-latest
    needs: build-aio

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests/aio
          pattern: digests-aio-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image namespace
        id: img
        shell: bash
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nexterm" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        run: |
          IMAGE="${{ steps.img.outputs.base }}/aio"
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ inputs.version }}" \
            $(printf "$IMAGE@sha256:%s " $(ls "${{ runner.temp }}/digests/aio"))
